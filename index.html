<style>
:root{--bg:#f4f6f9;--surface:#fff;--ink:#14284b;--muted:#5b6b86;--teal:#1f8a8a;--gold:#c9a227;--line:#d5dbe6;--bad:#b3402f;

{id:"c1",module:"1",level:"all",type:"ctw",title:"Complete the words",text:"Sleep is a biological process that restores the body and supports learning. Researchers inves[tigate] how the br[ain] stor[es] new inform[ation] during rest. Most adu[lts] nee[d] seven to nine hours each night. Without enough sleep, concentration and memory often decline."},
{id:"d1",module:"1",level:"all",type:"daily",title:"Notice",text:"Campus Pool Closure\n\nThe campus pool will close for repairs from Monday, March 4, to Friday, March 8. Members may use the Eastside gym instead, but towels will not be provided there. Membership fees will not change. Questions? Visit the front desk."},
{id:"a1",module:"1",level:"all",type:"academic",title:"Rooftop Gardens",text:"Rooftop gardens are increasingly common in crowded cities. Layers of soil and vegetation insulate buildings, which lowers heating and cooling costs. They also absorb rainwater, reducing the burden on drainage systems during storms.\n\nHowever, such gardens are expensive to install, and roofs must be reinforced to carry the extra weight. Some cities therefore offer subsidies to building owners, hoping that long-term savings will outweigh the initial expense."},
{id:"c2",module:"2",level:"all",type:"ctw",title:"Complete the words",text:"Marine biology introduces students to life in the oceans. Scientists col[lect] data by meas[uring] water tempe[rature] and sal[inity]. They use this infor[mation] to understand how clim[ate] change affects marine life. Mod[ern] tools such as satel[lites] and underwater sen[sors] help researchers trac[k] species over long periods."},
{id:"d2",module:"2",level:"easy",type:"daily",title:"Text messages",text:"Maya (2:10 P.M.): Are we still meeting to study at 4?\nBen (2:12 P.M.): I have a lab until 4:30. Can we meet at 5 instead?\nMaya (2:13 P.M.): Sure. The library closes at 6, so we'll have an hour. Should I reserve a room?\nBen (2:14 P.M.): Yes please. I'll bring the notes."},
{id:"a2",module:"2",level:"hard",type:"academic",title:"Tidal Energy",text:"Tidal power generates electricity from the regular rise and fall of ocean water. Unlike wind or solar energy, tides are highly predictable, which allows engineers to forecast output years in advance.\n\nYet few tidal stations exist. Turbines must withstand corrosive seawater and powerful currents, and construction can disturb fish migration routes. Researchers are therefore testing smaller, modular turbines that can be placed gradually, allowing ecologists to monitor effects before expanding."},
{id:"c3",module:"1",level:"all",type:"ctw",title:"Complete the words",text:"Economics is the study of how people use limited resources to meet their needs. Households, businesses, and governments must all decide how to spend money and time. Econo[mists] ana[lyze] how these deci[sions] affect pri[ces], emplo[yment], and growth. They often com[pare] alter[natives] before recom[mending] polic[ies] that bal[ance] costs and benefits. Their work helps societies make better choices."},
{id:"d3",module:"1",level:"all",type:"daily",title:"Email",text:"From: Professor Ruiz\nTo: Biology 101 students\n\nOur lab session on Thursday has moved from Room 204 to Room 118 because of a ventilation problem. Please bring your safety goggles and arrive ten minutes early to pick up a new handout. Lab reports are still due on Friday."},
{id:"d4",module:"1",level:"all",type:"daily",title:"Notice",text:"Bike Share Offer\n\nStudents can now rent bicycles from the Student Union for $5 per day or $20 per week. Helmets are free with every rental. A valid student ID is required, and bikes must be returned by 8 p.m. Late returns are charged an extra $10."},
{id:"l1",module:"1",level:"all",type:"daily",title:"Email",text:"Subject: Your Apartment Application\n\nDear Ms. Okafor,\n\nThank you for applying for a one-bedroom apartment at Maple Court. We have reviewed your documents and are pleased to tell you that your application has been approved.\n\nTo secure the apartment, please pay a deposit equal to one month's rent within five days. You can pay online or at the leasing office, which is open weekdays from 9 a.m. to 5 p.m. Once the deposit is received, we will send you the lease to sign. Keys can be collected on the first day of the month.\n\nParking is available for an additional monthly fee. If you would like a space, please let us know when you pay the deposit.\n\nSincerely,\nDaniel Ortiz\nMaple Court Leasing Office"},
{id:"l2",module:"1",level:"all",type:"daily",title:"Email",text:"Subject: Volunteer Orientation\n\nHello new volunteers,\n\nWelcome to the Riverside Food Bank! Your orientation will take place on Saturday, October 12, from 10 a.m. to noon in the main warehouse. You will learn how donations are sorted, how to handle fresh food safely, and where to find supplies.\n\nPlease wear closed shoes and comfortable clothing. Lunch will be provided afterward, so let us know about any food allergies by Thursday. Parking is limited, so we encourage you to carpool or take the number 7 bus, which stops outside the entrance.\n\nWe look forward to meeting you.\n\nAmira Hassan\nVolunteer Coordinator"},
{id:"l3",module:"2",level:"easy",type:"daily",title:"Email",text:"Subject: Gym Membership Update\n\nDear member,\n\nStarting next month, the campus gym will open one hour earlier, at 6 a.m., on weekdays. Weekend hours will not change. We are also adding two new yoga classes on Tuesday and Thursday evenings.\n\nTo reserve a place in a class, log in to the student portal and choose the session you want. Spaces are limited to twenty people. If you cannot attend, please cancel at least two hours before the class so that someone else can take your spot.\n\nThank you,\nCampus Recreation"},
{id:"a3",module:"1",level:"all",type:"academic",title:"Shopping and Choice Overload",text:"Retailers often assume that offering more products attracts more customers. {A} A supermarket with fifty kinds of jam, for example, seems more appealing than one with six. {B} However, psychologists have found that an overwhelming range of options can actually discourage people from buying anything at all.\n\nIn one well-known experiment, shoppers were shown a tasting table with either six or twenty-four jams. Although the larger display drew more attention, customers who saw the smaller selection were several times more likely to make a purchase. Researchers explain that too many choices raise the effort of comparing them, and people worry that they will later regret their decision. {C}\n\nThese findings have influenced store design. Some retailers now limit their selections or group products into clear categories to make decisions easier. {D} Critics note, though, that the effect is weaker among experienced shoppers who already know what they want."}];

{task:"a1",q:"The word \"reinforced\" in the passage is closest in meaning to:",opts:["Painted","Strengthened","Removed","Measured"],correct:"B"},

// ===== LOADER =====
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c="" }else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 const h=rows.shift().map(s=>s.trim().toLowerCase());
 return rows.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}
// ===== TEST 2 =====
const T2_TASKS=[
{id:"t2c1",module:"1",level:"all",type:"ctw",title:"Complete the words",text:"Community gardens are shared spaces where residents grow flowers, fruit, and vegetables. Beyond producing food, these gardens can str[engthen] local relationships and offer opportuni[ties] for learning. Participants often exch[ange] adv[ice] about soil, water, and seasonal planting, while exper[ienced] gardeners may demon[strate] useful techniques. This cooperation can incre[ase] confidence among beginners and encour[age] people to take greater responsibility for a shared space. Researchers also exa[mine] whether gardens influence well-being in nearby neighborhoods. Although results vary, many studies sug[gest] that regular contact with green spaces can reduce stress. For this reason, some city planners include community gardens in broader neighborhood projects."},
{id:"t2s1",module:"1",level:"all",type:"daily",title:"Message",text:"From Mina:\n\nThe study room we booked is closed for repairs today. The library desk says Room 3B is free until noon, but we need to collect the key from reception. I can get it when I arrive at 9:15. Please bring the printed charts; I have the laptop and adapter."},
{id:"t2s2",module:"1",level:"all",type:"daily",title:"Notice from Campus Transport",text:"Starting Monday, the Route 6 shuttle will leave the science building every 20 minutes instead of every 15 minutes between 2:00 and 5:00 p.m. Morning service is unchanged. Students travelling to the sports center after afternoon classes should allow extra time. The updated timetable is posted beside the main entrance."},
{id:"t2l1",module:"1",level:"all",type:"daily",title:"Email: Equipment Loan Update",text:"From: Campus Media Desk\nTo: Student Project Teams\nSubject: New procedure for borrowing recording equipment\n\nBeginning 4 November, teams that need cameras, microphones, or portable lights must submit a loan request at least two working days before collection. Requests can be made through the Media Desk website; submitting a form does not guarantee every item will be available. A confirmation email will list the equipment reserved and the collection window. One team member must show a student ID when collecting items, and all equipment must be returned by 4:30 p.m. on the agreed return date. Late returns may affect the team’s ability to borrow equipment for future projects. If your schedule changes, contact the desk rather than submitting a second request."},
{id:"t2l2",module:"1",level:"all",type:"daily",title:"Campus Notice: Quiet Study Zone",text:"The second floor of the West Learning Center will become a quiet study zone from 18 November. Group discussions and online meetings should take place on the first floor, where small rooms can be booked in 30-minute blocks. The new zone will still allow laptop use and headphones, but phone calls are not permitted. During the first two weeks, library staff will be available near the stairs to help visitors find suitable spaces. Students who need accessible seating can ask at the information desk, which can arrange a desk near the elevator."},
{id:"t2a1",module:"1",level:"all",type:"academic",title:"Repair Cafés",text:"Repair cafés are community events where people bring broken household objects and work with volunteers to repair them. A visitor might arrive with a lamp that no longer switches on, a jacket with a torn seam, or a toaster that has stopped heating. Rather than simply handing the item to a professional, visitors are encouraged to observe the process and, when possible, take part. The aim is not only to prevent usable materials from becoming waste but also to share practical skills that many people have had fewer opportunities to learn.\n\nThese events can also change how participants think about the products they own. When people discover that a loose wire or a missing button is responsible for a problem, they may become less likely to discard similar items in the future. Some organizers record the number and types of objects repaired, using the information to identify common product failures. However, repair cafés cannot solve every problem. Some devices are designed in ways that make them difficult to open, and replacement parts may be unavailable or cost more than a new product. Organizers therefore often combine hands-on repair with discussions about product design and the benefits of making goods easier to maintain."},
{id:"t2a2",module:"1",level:"all",type:"academic",title:"The Value of Urban Night Markets",text:"In many cities, night markets transform streets or public squares into temporary places to buy food, crafts, and everyday goods. Because they operate after normal working hours, they can attract people who have little time to shop during the day. For small sellers, these markets may offer a relatively inexpensive way to test a product or reach customers without committing to a permanent storefront. The markets can also give residents and visitors a reason to spend time in public spaces that might otherwise be quiet in the evening.\n\nTheir popularity, however, can create difficulties. Crowds may block sidewalks, music and conversations can disturb nearby residents, and extra rubbish may remain after stalls close. Some cities respond by setting clear closing times, providing waste stations, and designing pedestrian routes that keep emergency access open. Others ask market organizers to consult residents before changing the number or location of stalls. Such measures do not remove every source of disagreement, but they can make the market’s benefits easier to maintain over time. The success of a night market therefore depends not only on the number of visitors it attracts, but also on how carefully it is managed."},
{id:"t2a3",module:"1",level:"all",type:"academic",title:"Learning Through Retrieval",text:"When students try to remember information without looking at their notes, they are using retrieval practice. This may feel more difficult than rereading a chapter, but the effort can strengthen later recall. For example, after studying a set of scientific terms, a student might close the book and explain each term aloud or answer a few questions from memory. The student can then check the answers and correct misunderstandings.\n\nRetrieval practice is most useful when it is repeated over time and followed by feedback. A single difficult attempt may reveal gaps in knowledge without making the information easy to remember immediately. Returning to the material after a delay gives the learner another chance to retrieve it, while feedback helps prevent errors from becoming established. The method is not a replacement for initial learning: students still need clear explanations and examples before they can retrieve unfamiliar information. Instead, retrieval works as a bridge between learning something for the first time and being able to use it later. Teachers can build it into lessons with short, low-stakes quizzes, quick written summaries, or pair discussions in which students explain a concept without consulting their notes."},
{id:"t2c2",module:"2",level:"easy",type:"ctw",title:"Complete the words",text:"Local museums preserve objects that help people understand the past. They dis[play] items such as tools, photog[raphs], and clothing, and prov[ide] explanations of how people used them. Some museums org[anize] workshops where visitors can try traditional crafts. Staff members also coll[ect] stories from local residents, which can add personal details to historical rec[ords]. These activities help the public conn[ect] everyday life today with events from earlier generations. Although a museum cannot display everything it owns, careful sel[ection] allows visitors to explore important themes. Staff may also expl[ain] why certain objects were chosen, and they often ans[wer] questions from school groups. A good exhibition invites questions and encourages people to learn more."},
{id:"t2e1",module:"2",level:"easy",type:"daily",title:"Message thread",text:"Leo (1:05 p.m.): The workshop has moved from Lab 12 to Room 204 because the lab computers are being updated.\nNora (1:07 p.m.): Thanks. Do we still need to bring our own headphones?\nLeo (1:08 p.m.): Yes, please. The room has computers, but no spare headphones. The instructor also asked everyone to arrive ten minutes early to install the audio software.\nNora (1:09 p.m.): Got it. I’ll tell Sam, who is on his way to the lab now."},
{id:"t2e2",module:"2",level:"easy",type:"daily",title:"Email: Community Center Classes",text:"Hello residents,\n\nRegistration for the winter photography course opens on 6 December. The six-week course meets on Thursday evenings from 6:30 to 8:00 p.m. Participants should bring a camera or a phone with a camera; no previous experience is needed. The fee is $30, payable when you register. Because the class is small, places are confirmed in the order that payments are received. If you have questions about accessibility, email the center before registering.\n\nCommunity Center Team"},

async function load(){
 if(!(CFG.tasksUrl&&CFG.questionsUrl))return;
 try{
  const [tt,qt]=await Promise.all([fetch(CFG.tasksUrl).then(r=>r.text()),fetch(CFG.questionsUrl).then(r=>r.text())]);
  const tasks=parseCSV(tt).map((r,i)=>{
   const type=(r.type||"").toLowerCase();
   if(!r.task_id||!["ctw","daily","academic"].includes(type)||!r.text)throw new Error("Tasks sheet, row "+(i+2)+": needs task_id, text and a type of ctw, daily or academic.");
   if(type=="ctw"&&!/\w+\[\w+\]/.test(r.text))throw new Error("Tasks sheet, row "+(i+2)+": a ctw text needs hidden letters in brackets, like inves[tigate].");
   return {id:r.task_id,test:r.test_id||"",module:r.module,level:(r.level||"all").toLowerCase(),type,title:r.title,text:r.text}});
  const ids=tasks.map(t=>t.id);
  const q=parseCSV(qt).map((r,i)=>{
   const kind=(r.type||"").toLowerCase(),o=kind=="insert"?["At [A]","At [B]","At [C]","At [D]"]:[r.option_a,r.option_b,r.option_c,r.option_d];if(kind=="sentence")o.fill("-");
   if(!ids.includes(r.task_id)||!r.question||o.some(x=>!x)||(kind=="sentence"?!r.correct:!/^[ABCD]$/i.test(r.correct)))throw new Error("Questions sheet, row "+(i+2)+": needs a task_id that exists in Tasks, a question, four options and a correct letter (A–D).");
   return {task:r.task_id,q:r.question,opts:o,kind,correct:kind=="sentence"?r.correct:r.correct.toUpperCase()}});
  ALL={tasks,q};D.source="sheet";
 }catch(e){D.error=e.message||"Could not load the sheet. Showing the built-in tests instead."}
}

const RX=/(\w+)\[(\w+)\]/g;const RK={ctw:0,daily:1,academic:2};const key=t=>RK[t.type]*2+(t.type=="daily"&&t.text.length>450?1:0);
function pass(it,sel){const t=it.t.text,k=it.q.kind;
 if(k=="sentence")return t.replace(/\{[A-D]\}/g,"").split("\n\n").map(p=>(p.match(/[^.!?]+[.!?]+\s*/g)||[p]).map(s=>`<span class="sn${sel===s.trim()?" sel":""}" data-t="${esc(s.trim())}">${esc(s)}</span>`).join("")).join("\n\n");
 if(k=="paragraph")return esc(t).replace(/\{[A-D]\}/g,"").split("\n\n").map((p,n)=>`<b class="mk">Paragraph ${n+1}</b>\n${p}`).join("\n\n");
 return esc(t).replace(/\{([A-D])\}/g,k=="insert"?'<b class="mk">[$1]</b>':"")}
function build(m,level){const out=[];
 D.tasks.filter(t=>t.module==String(m)&&(t.level=="all"||t.level==level)).sort((x,y)=>key(x)-key(y)).forEach(t=>{
  if(t.type=="ctw")out.push({k:"ctw",t,bl:[...t.text.matchAll(RX)].map(x=>({stem:x[1],ans:x[2]}))});
  else D.q.filter(q=>q.task==t.id).forEach(q=>out.push({k:"mc",t,q}))});
 return out}
function score(){let r=0,t=0;S.items.forEach((it,i)=>{const a=S.ans[i];
 if(it.k=="mc"){t++;if(it.q.kind=="sentence"?(a||"")==it.q.correct.trim():a!=null&&"ABCD"[a]==it.q.correct)r++}
 else it.bl.forEach((b,k)=>{t++;if(a&&(a[k]||"").trim().toLowerCase()==b.ans.toLowerCase())r++})});return{r,t}}
const done=i=>{const a=S.ans[i],it=S.items[i];return it.k=="mc"?a!=null:!!a&&it.bl.every((b,k)=>(a[k]||"").length==b.ans.length)};

function randomSet(){

 const isLong=t=>t.text.length>450,sel=f=>T.filter(f);
 const pickTo=(first,rest,target)=>{const c=[];let n=0;
  for(const pool of first){const t=pk(pool.filter(x=>!c.includes(x)))[0];if(t){c.push(t);n+=qn(t)}}
  const more=pk(rest.filter(x=>!c.includes(x)));
  while(n<target&&more.length){const t=more.shift();c.push(t);n+=qn(t)}
  return c};
 const m1=x=>x.module=="1"&&x.level=="all";
 const ctw=sel(x=>m1(x)&&x.type=="ctw"),sh=sel(x=>m1(x)&&x.type=="daily"&&!isLong(x)),lg=sel(x=>m1(x)&&x.type=="daily"&&isLong(x)),ac=sel(x=>m1(x)&&x.type=="academic");
 const r1=pickTo([ctw,sh,lg,ac],[...sh,...lg,...ac],33);

 return [...new Set([...r1,...re,...rh])]}

function ctxOf(sp){
 const b=sp.closest("p,.passage,.q,.opt,.card,h1,h2")||sp.parentElement;
 const r=document.createRange();r.selectNodeContents(b);r.setEnd(sp,0);
 const pos=r.toString().length,t=b.textContent;

 let e=t.slice(pos).search(/[.!?\n]/);e=e<0?t.length:pos+e+1;

 p.innerHTML=`<b>${esc(word)}</b><p class="muted" style="margin:6px 0 0">Translating…</p>`;place(p,sp);
 try{
  const k=word.toLowerCase()+"|"+ctx;

}

function ctwQuiz(text,again){

 };

function passHTML(text,q,sel){
 const k=q.kind;
 if(k=="sentence")return text.replace(/\{[A-D]\}/g,"").split("\n\n").map(p=>(p.match(/[^.!?]+[.!?]+\s*/g)||[p]).map(x=>{const t=x.trim(),c=sel==null?"":" locked"+(t==q.answer?" good":t==sel?" bad":"");return `<span class="sn${c}" data-t="${esc(t)}">${wrap(x)}</span>`}).join("")).join("\n\n");
 if(k=="insert")return text.split(/(\{[A-D]\})/).map(x=>/^\{[A-D]\}$/.test(x)?`<b class="mk">[${x[1]}]</b>`:wrap(x)).join("");
 return text.replace(/\{[A-D]\}/g,"").split("\n\n").map((p,n)=>(k=="paragraph"?`<b class="mk">Paragraph ${n+1}</b>\n`:"")+wrap(p)).join("\n\n");
}
function readQuiz(head,task,qs,again){

  app.querySelectorAll(".sn").forEach(x=>x.onclick=()=>{if(got[i]!=null)return;got[i]=x.dataset.t;draw()});

 };
 draw();
}

 const rows=[...P].reverse().map(x=>{
  const a=x.s[0],b=x.s[1],tr=a.r+b.r,tt=a.t+b.t,p=pc(tr,tt);
  const when=new Date(x.d).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return `<div class="card"><b>${esc(x.name)}</b> <span class="muted">${esc(when)}</span><div class="big" style="font-size:28px;margin:6px 0">${tr}/${tt} <span class="muted" style="font:600 16px Calibri,system-ui,sans-serif">(${p}%)</span></div><div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><div style="width:${p}%;height:100%;background:var(--teal)"></div></div><p style="margin:8px 0 0">Module 1: ${a.r}/${a.t} (${pc(a.r,a.t)}%)<br>Module 2${x.level?" ("+esc(x.level)+" version)":""}: ${b.r}/${b.t} (${pc(b.r,b.t)}%)</p></div>`}).join("");
 app.innerHTML=`<h1>My progress</h1><div class="card"><div class="big">${P.length}</div><p class="muted" style="margin:6px 0 0">tests finished</p></div><div class="card"><div class="big">${V.length}</div><p class="muted" style="margin:6px 0 0">words saved</p></div><div class="card"><div class="big" id="apn">${Object.keys(AL).length}</div><p class="muted" style="margin:6px 0 0">academic words learned</p></div><h2 style="font:700 22px Cambria,Georgia,serif;margin:22px 0 10px">Score history</h2>${rows||'<div class="card">No finished tests yet. Finish a Saved test or a Random exam and your results will appear here.</div>'}<p class="muted">Your progress is saved in this browser on this device only.</p><div class="row"><button class="btn alt" id="hm">Back to main screen</button></div>`;
 document.getElementById("hm").onclick=goBack;
 loadAcad().then(()=>{const e=document.getElementById("apn");if(tok===GEN&&e)e.textContent=AW.filter(w=>isL(w.id)).length}).catch(()=>{});
}
function endMod(){
 clearInterval(S.tick);
 const {r,t}=score();S.scores.push({r,t});S.hist.push({mod:S.mod,items:S.items,ans:S.ans});
 if(S.mod==1){
  S.level=r/t>=CFG.hardThreshold?"hard":"easy";S.items=build(2,S.level);
  app.innerHTML=`<h1>Module 1 complete</h1><p>You can't return to it. Module 2 has a ${CFG.minutes[1]}-minute timer that starts when you press the button.</p><button class="btn" id="m2">Start Module 2</button>`;
  document.getElementById("m2").onclick=()=>startMod(2);
 }else{saveRun();results()}
}
let EX=[];const EXC={};
function mistakes(){const out=[];EX=[];for(const k in EXC)delete EXC[k];
 S.hist.forEach(h=>h.items.forEach((it,i)=>{const a=h.ans[i];
  if(it.k=="ctw"){
   const w=it.bl.map((b,k)=>({b,y:((a||[])[k]||"").trim()})).filter(x=>x.y.toLowerCase()!=x.b.ans.toLowerCase());
   if(w.length)out.push(`<div class="card"><b>Module ${h.mod} · Complete the words</b><p class="muted">${w.length} of ${it.bl.length} words wrong</p>${w.map(x=>`<div><span class="warn">${esc(x.b.stem+(x.y||"(blank)"))}</span> → <b class="ok">${esc(x.b.stem+x.b.ans)}</b></div>`).join("")}</div>`);
  }else{
   const q=it.q,s=q.kind=="sentence",good=s?(a||"")==q.correct.trim():a!=null&&"ABCD"[a]==q.correct;
   if(!good){const ci="ABCD".indexOf(q.correct);
    const yours=s?(a||""):(a==null?"":"ABCD"[a]+". "+q.opts[a]);
    const cor=s?q.correct:"ABCD"[ci]+". "+q.opts[ci],n=EX.length;
    EX.push({kind:q.kind||"",passage:q.kind=="insert"?it.t.text:it.t.text.replace(/\{[A-D]\}/g,""),question:q.q,options:s?[]:q.opts,correct:cor,chosen:yours});
    out.push(`<div class="card"><b>Module ${h.mod} · ${esc(it.t.title)}</b><p>${esc(q.q)}</p><p><span class="muted">Your answer:</span> <span class="warn">${esc(yours||"No answer")}</span></p><p><span class="muted">Correct answer:</span> <b class="ok">${esc(cor)}</b></p><button class="btn alt" data-ex="${n}">Show AI explanation</button><div id="exb${n}"></div></div>`)}
  }}));
 return out}
function passageView(text,ev,whole){
 const mk=x=>x.replace(/\{([A-D])\}/g,'<b class="mk">[$1]</b>');
 let m=null;
 if(ev){try{m=text.match(new RegExp(ev.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+")))}catch(e){}}
 if(!m)return whole?mk(esc(text)):"";
 const a=m.index,b=a+m[0].length;let s=0,e=text.length;
 if(!whole){
  let k=a;while(k>0&&/\s/.test(text[k-1]))k--;
  if(k>0){k--;while(k>0&&!/[.!?\n]/.test(text[k-1]))k--;while(k<a&&/\s/.test(text[k]))k++;s=k}
  k=b;while(k<text.length&&/\s/.test(text[k]))k++;
  if(k<text.length){while(k<text.length&&!/[.!?\n]/.test(text[k]))k++;e=Math.min(k+1,text.length)}
 }
 return (s>0?"\u2026 ":"")+mk(esc(text.slice(s,a))+`<span class="hl">${esc(m[0])}</span>`+esc(text.slice(b,e)))+(e<text.length?" \u2026":"");
}
function showExpl(i,e,r,box){
 const ev=e.kind=="sentence"?e.correct:e.kind=="insert"?"{"+e.correct[0]+"}":(r.evidence||"");
 const ex=passageView(e.passage,ev,false),full=passageView(e.passage,ev,true);let open=false;
 box.innerHTML=`<div class="passage" id="exp${i}" style="max-height:none;margin:10px 0 0"${ex?"":" hidden"}>${ex}</div><button class="btn alt" id="exf${i}" style="margin-top:8px">Read full passage</button><p style="margin:10px 0 0"><b>Explanation:</b> ${esc(r.explanation)}</p><p class="muted" style="margin:6px 0 0;font-size:14px">AI-generated, so it can be wrong. Check it against the passage.</p>`;
 document.getElementById("exf"+i).onclick=ev2=>{
  open=!open;const p=document.getElementById("exp"+i);
  p.innerHTML=open?full:ex;p.style.maxHeight=open?"50vh":"none";p.hidden=!open&&!ex;
  ev2.target.textContent=open?(ex?"Show only the excerpt":"Hide full passage"):"Read full passage";
 };
}
async function explain(i,b){
 const box=document.getElementById("exb"+i),e=EX[i];
 if(!box||!e)return;
 b.disabled=true;b.textContent="Thinking\u2026";box.innerHTML="";
 try{
  const r=EXC[i]||(EXC[i]=await callAI({task:"explain",...e}));
  if(!r||!r.explanation)throw new Error("empty");
  showExpl(i,e,r,box);
  b.remove();
 }catch(err){
  delete EXC[i];b.disabled=false;b.textContent="Try again";
  box.innerHTML=`<p class="warn" style="margin:10px 0 0">Couldn't get an explanation. Try again in a moment. If this keeps happening, the free daily limit may be used up.</p>`;
 }
}
function results(){
 guard=false;R[idx]=results;
 const [a,b]=S.scores,hard=S.level=="hard",mk=mistakes();
 app.innerHTML=`<h1>Reading complete</h1>
 <div class="card"><div class="big">${a.r+b.r}/${a.t+b.t}</div><p class="muted">raw score (correct answers)</p></div>
 <div class="card"><b>Module 1:</b> ${a.r} of ${a.t} correct (${Math.round(100*a.r/a.t)}%)</div>
 <div class="card"><b>Module 2, ${S.level} version:</b> ${b.r} of ${b.t} correct<br>
 <span class="muted">${hard?"You reached the hard version, so the top reading scores were open to you.":"Module 1 routed you to the easy version, which caps the maximum reading score at about 3.0–3.5."}</span></div>
 <p class="muted">The 0–6 scaled score isn't calculated: ETS publishes no official conversion chart.</p>
 <h2 style="font:700 22px Cambria,Georgia,serif;margin:22px 0 10px">Review your mistakes (${mk.length})</h2>
 ${mk.length?mk.join(""):'<div class="card">No mistakes. Every answer was correct.</div>'}
 <button class="btn" id="again">Practice again</button>`;
 app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>explain(+b.dataset.ex,b));
 document.getElementById("again").onclick=toHome;
}
history.replaceState({i:0},"");R[0]=home;
load().then(home);
</script>
